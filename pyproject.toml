[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "check-hosts"
version = "0.1.0"
description = "Concurrent ICMP and SSH host checks with PostgreSQL status updates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
check-hosts = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["utils_python"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
